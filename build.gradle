plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	mods {
		"justaclient" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Sodium is required at runtime and is put on the dev client so runClient matches real play.
	modImplementation "maven.modrinth:sodium:${project.sodium_version}"

	// Iris (optional, looked up by name) on the dev client only, to test world effects under shader packs.
	modLocalRuntime "maven.modrinth:iris:${project.iris_version}"
	// Iris nests these; the dev client does not load nested jars from Modrinth's copy.
	localRuntime "org.anarres:jcpp:1.4.14"
	localRuntime "io.github.douira:glsl-transformer:3.0.0-pre3"
	localRuntime "org.antlr:antlr4-runtime:4.13.1"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
